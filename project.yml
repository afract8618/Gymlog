name: GymLog
options:
  bundleIdPrefix: com.gymlog
  deploymentTarget:
    iOS: "17.0"
targets:
  GymLog:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymlog.app
        PRODUCT_NAME: GymLog
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gym Log
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
